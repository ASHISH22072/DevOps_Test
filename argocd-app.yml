# argocd-app.yaml 
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clients-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/clients-api-gitops.git #GitOps Repo URL
    targetRevision: HEAD 
    path: k8s/prod #The folder containing all the above YAMLs
  destination:
    server: https://kubernetes.default.svc
    namespace: clients-api-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
